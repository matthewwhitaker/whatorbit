<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Orbit?</title>
    <link rel="stylesheet" href="style.css">
    <script src="graphics.js" defer></script>
</head>
<body>
    <header>
        <h1>What Orbit?</h1>
    </header>
    <div id="orb">
        <div id="orboptions">
            P <input type="range" id="period" min="0.1" max="10" step="0.1" value="10"><br>
            t0 <input type="range" id="t0" min="0" max="10" step="0.1" value="0"><br>
            e <input type="range" id="eccentricity" min="0" max="1" step="0.01" value="0.5"><br>
            a <input type="range" id="semi-major-axis" min="0.1" max="50" step="0.1" value="5"><br>
            i <input type="range" id="inclination" min="0" max="180" step="1" value="0"><br>
            &omega; <input type="range" id="argument-of-periapsis" min="0" max="360" step="1" value="0"><br>
            &Omega; <input type="range" id="longitude-of-ascending-node" min="0" max="360" step="1" value="0"><br>
            A <input type="range" id="A" min="-50" max="50" step="0.1" value="5" disabled><br>
            B <input type="range" id="B" min="-50" max="50" step="0.1" value="0" disabled><br>
            C <input type="range" id="C" min="-50" max="50" step="0.1" value="0" disabled><br>
            F <input type="range" id="F" min="-50" max="50" step="0.1" value="0" disabled><br>
            G <input type="range" id="G" min="-50" max="50" step="0.1" value="5" disabled><br>
            H <input type="range" id="H" min="-50" max="50" step="0.1" value="0" disabled><br>
        </div>
        <div id="orbpane">
            <canvas id="orbcanvas"></canvas>
        </div>
    </div>
</body>
</html>
